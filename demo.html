<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jadwal Sholat Hari Ini — Demo API jadwal-sholat-indonesia</title>
<meta name="description" content="Demo widget jadwal sholat harian per kota di Indonesia. Data dari API gratis jadwal-sholat-indonesia: fetch JSON statis via CDN, tanpa server.">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "jadwal-sholat-indonesia",
  "applicationCategory": "UtilitiesApplication",
  "operatingSystem": "Any",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "IDR" },
  "description": "API dan dataset jadwal sholat harian per kota di Indonesia (metode Kemenag RI). JSON statis via CDN, gratis, lisensi MIT."
}
</script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  select, button { font-size: 1rem; padding: .5rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  td { padding: .45rem .25rem; border-bottom: 1px solid #e5e5e5; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .note { color: #666; font-size: .85rem; margin-top: 1rem; }
</style>
</head>
<body>
<h1>Jadwal Sholat Hari Ini</h1>
<p>
  <select id="city"><option>Memuat daftar kota…</option></select>
  <button id="load">Tampilkan</button>
</p>
<table id="times" hidden></table>
<p class="note">Data: <a href="https://github.com/ANGGATYASIA/jadwal-sholat-indonesia">jadwal-sholat-indonesia</a>
(metode Kemenag RI). Waktu dalam zona kota masing-masing.</p>

<script>
const BASE = 'https://cdn.jsdelivr.net/gh/ANGGATYASIA/jadwal-sholat-indonesia@main/api';
const NAMES = { imsak:'Imsak', subuh:'Subuh', terbit:'Terbit', dzuhur:'Dzuhur',
                ashar:'Ashar', maghrib:'Maghrib', isya:'Isya' };

async function init() {
  const cities = await (await fetch(`${BASE}/cities.json`)).json();
  const sel = document.getElementById('city');
  sel.innerHTML = '';
  cities.forEach(c => {
    const o = document.createElement('option');
    o.value = c.code;
    o.textContent = `${c.name} (${c.timezone})`;
    sel.appendChild(o);
  });
  document.getElementById('load').onclick = () => show(sel.value);
  show(sel.value);
}

async function show(code) {
  const year = new Date().getFullYear();
  const days = await (await fetch(`${BASE}/times/${code}/${year}.json`)).json();
  const today = new Date().toISOString().slice(0, 10);
  const d = days.find(x => x.date === today) || days[0];
  const t = document.getElementById('times');
  t.hidden = false;
  t.innerHTML = `<caption style="text-align:left;padding:.25rem 0"><strong>${d.date}</strong></caption>` +
    Object.keys(NAMES).map(k =>
      `<tr><td>${NAMES[k]}</td><td>${d[k]}</td></tr>`).join('');
}

init();
</script>
</body>
</html>
